<!-- @dsCard group="Colors" viewport="700x230" name="Panel lockups" subtitle="Copy these three pairings rather than re-deriving them" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Panels</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
  <div style="border-radius:18px;background:#C8F068;padding:14px 15px;min-height:150px;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <span style="font-size:52px;font-weight:800;line-height:.85;letter-spacing:-0.05em;font-variant-numeric:tabular-nums">01</span>
      <span style="font-size:9px;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:100px;border:1px solid rgba(20,23,15,.28)">CONNECT</span>
    </div>
    <div style="margin-top:auto;font-size:12px;line-height:1.5;color:rgba(20,23,15,.72)">Ink on lime. Body at 72% ink.</div>
  </div>
  <div style="border-radius:18px;background:linear-gradient(160deg,#9FD1F2,#5B9BD9);padding:14px 15px;min-height:150px;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <span style="font-size:52px;font-weight:800;line-height:.85;letter-spacing:-0.05em;color:#fff;font-variant-numeric:tabular-nums">02</span>
      <span style="font-size:9px;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:100px;border:1px solid rgba(255,255,255,.65);color:#fff">DIGEST</span>
    </div>
    <div style="margin-top:auto;font-size:12px;line-height:1.5;color:rgba(11,34,51,.82)">White numeral, water-ink body. Never ink type.</div>
  </div>
  <div style="border-radius:18px;background:#14170F;padding:14px 15px;min-height:150px;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <span style="font-size:52px;font-weight:800;line-height:.85;letter-spacing:-0.05em;color:#C8F068;font-variant-numeric:tabular-nums">03</span>
      <span style="font-size:9px;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:100px;border:1px solid rgba(247,247,239,.35);color:#F7F7EF">COCKPIT</span>
    </div>
    <div style="margin-top:auto;font-size:12px;line-height:1.5;color:rgba(247,247,239,.7)">Lime numeral, cream body at 70%.</div>
  </div>
</div>
</body></html>
