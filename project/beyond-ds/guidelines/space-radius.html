<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="18 panels · 14 cards · 10 surfaces · 8 controls · 100 pills" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Radius</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div style="display:flex;align-items:flex-end;gap:14px">
  <div class="sw"><div style="width:88px;height:56px;border-radius:18px;background:var(--by-lime);border:1px solid var(--by-line-strong)"></div><div class="n">Panel</div><div class="h">18px</div></div><div class="sw"><div style="width:88px;height:56px;border-radius:14px;background:var(--by-cream);border:1px solid var(--by-line-strong)"></div><div class="n">Card</div><div class="h">14px</div></div><div class="sw"><div style="width:88px;height:56px;border-radius:10px;background:var(--by-cream);border:1px solid var(--by-line-strong)"></div><div class="n">Surface</div><div class="h">10px</div></div><div class="sw"><div style="width:88px;height:56px;border-radius:8px;background:var(--by-cream);border:1px solid var(--by-line-strong)"></div><div class="n">Control</div><div class="h">8px</div></div><div class="sw"><div style="width:88px;height:56px;border-radius:6px;background:var(--by-cream);border:1px solid var(--by-line-strong)"></div><div class="n">Chip</div><div class="h">6px</div></div><div class="sw"><div style="width:88px;height:56px;border-radius:100px;background:var(--by-lime);border:1px solid var(--by-line-strong)"></div><div class="n">Pill</div><div class="h">100px</div></div>
</div>
</body></html>
