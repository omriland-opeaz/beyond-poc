<!-- @dsCard group="Brand" viewport="700x160" name="The mark" subtitle="A lime rounded square eclipsed by an ink circle. Nothing else." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Mark</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div style="display:flex;align-items:center;gap:34px;flex-wrap:wrap">
  <img src="../assets/beyond-mark.svg" width="72" height="72" alt="_beyond mark">
  <img src="../assets/beyond-mark.svg" width="34" height="34" alt="">
  <span style="display:flex;align-items:center;gap:10px"><img src="../assets/beyond-mark.svg" width="26" height="26" alt=""><span style="font-size:19px;font-weight:700;letter-spacing:-0.02em">_beyond</span></span>
  <span style="display:flex;align-items:center;gap:10px;background:var(--by-ink);padding:9px 14px;border-radius:10px"><img src="../assets/beyond-mark-cream.svg" width="24" height="24" alt=""><span style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:var(--by-cream)">_beyond</span></span>
</div>
<div class="u" style="margin-top:14px">Radius is 29–30% of the side. The disc sits at the bottom-right and is clipped by the square. On ink, the disc turns cream.</div>
</body></html>
