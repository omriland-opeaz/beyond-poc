<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Flows</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<svg viewBox="0 0 660 90" style="width:100%;height:96px">
  <path d="M10,20 L640,20" fill="none" stroke="#5B9BD9" stroke-width="1.6" stroke-dasharray="7 6" stroke-linecap="round" style="animation:byFlow 1s linear infinite"/>
  <path d="M10,48 L640,48" fill="none" stroke="rgba(20,23,15,.28)" stroke-width="1.6" stroke-dasharray="7 6" stroke-linecap="round"/>
  <path d="M10,76 L640,76" fill="none" stroke="rgba(192,71,63,.55)" stroke-width="1.6" stroke-dasharray="7 6" stroke-linecap="round"/>
  <text x="650" y="24" font-size="10" fill="#6B6B61" text-anchor="end" font-family="Space Grotesk">live</text>
  <text x="650" y="52" font-size="10" fill="#6B6B61" text-anchor="end" font-family="Space Grotesk">idle</text>
  <text x="650" y="80" font-size="10" fill="#6B6B61" text-anchor="end" font-family="Space Grotesk">broken</text>
</svg>
</body></html>
