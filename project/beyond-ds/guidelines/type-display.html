<!-- @dsCard group="Type" viewport="700x260" name="Display scale" subtitle="Space Grotesk at 800 — hero, numeral, screen title, card title" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Display</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">
  <div>
    <div class="lab">Hero · 56 / 800 · −0.035em · 1.03</div>
    <div style="font-size:56px;font-weight:800;letter-spacing:-0.035em;line-height:1.03;margin-top:4px">Everything you<br>want to know</div>
  </div>
  <div style="display:flex;align-items:flex-end;gap:26px">
    <div>
      <div class="lab">Numeral · 96 / 800 · tabular</div>
      <div style="font-size:96px;font-weight:800;letter-spacing:-0.05em;line-height:.85;font-variant-numeric:tabular-nums">02</div>
    </div>
    <div style="flex:1">
      <div class="lab">Screen title · 30 / 800 · −0.025em</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.025em;line-height:1.2;margin:4px 0 12px">Six graphs you don't have to ask for.</div>
      <div class="lab">Card title · 20 / 800</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;margin-top:4px">Plug in anything.</div>
    </div>
  </div>
</div>
</body></html>
