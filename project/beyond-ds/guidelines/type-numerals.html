<!-- @dsCard group="Type" viewport="700x160" name="Numerals are tabular" subtitle="Every figure, date and confidence — no exceptions" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Numerals</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
  <div>
    <div class="lab">Tabular · correct</div>
    <div style="font-variant-numeric:tabular-nums;font-size:14px;line-height:1.9;font-weight:600">
      31.4%<br>−11.4%<br>1 214 rows<br>3.1M
    </div>
  </div>
  <div style="opacity:.5">
    <div class="lab">Proportional · wrong</div>
    <div style="font-size:14px;line-height:1.9;font-weight:600">31.4%<br>−11.4%<br>1 214 rows<br>3.1M</div>
  </div>
</div>
<div class="u" style="margin-top:12px">A minus sign is a real minus (−), not a hyphen. Thousands are separated by a thin space, not a comma.</div>
</body></html>
