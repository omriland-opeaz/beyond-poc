<!-- @dsCard group="Spacing" viewport="700x180" name="Rules over boxes" subtitle="A line beats another card" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Rules</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start">
  <div>
    <div class="lab">Do</div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--by-ink);padding-bottom:8px;margin-top:8px">
      <span style="font-size:13px;font-weight:800">Done automatically</span>
      <span style="font-size:10px;color:var(--by-grey)">92 actions this month</span>
    </div>
    <div style="font-size:12px;padding:9px 0;border-bottom:1px solid var(--by-line)">Four product names merged</div>
    <div style="font-size:12px;padding:9px 0;border-bottom:1px solid var(--by-line)">Excel serials read as dates</div>
  </div>
  <div style="opacity:.5">
    <div class="lab">Don't</div>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
      <div style="border:1px solid var(--by-line);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)">Four product names merged</div>
      <div style="border:1px solid var(--by-line);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)">Excel serials read as dates</div>
    </div>
  </div>
</div>
</body></html>
