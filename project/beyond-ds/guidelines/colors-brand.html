<!-- @dsCard group="Colors" viewport="700x150" name="Lime, the one accent" subtitle="Five values, one job each — never a second accent" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lime</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div class="grid">
  <div class="sw" style="flex:1"><div class="chip" style="background:#C8F068;"></div><div class="n">Lime</div><div class="h">#C8F068</div><div class="u">Primary buttons, active fills, step 01, the shoreline</div></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:#B6E44E;"></div><div class="n">Lime hover</div><div class="h">#B6E44E</div><div class="u">Primary button hover only</div></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:#B9E353;"></div><div class="n">Lime deep</div><div class="h">#B9E353</div><div class="u">Lime as display type on cream</div></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:#A5CE3C;"></div><div class="n">Lime shade</div><div class="h">#A5CE3C</div><div class="u">Hand-drawn strokes and edges</div></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:#5F7A12;"></div><div class="n">Lime type</div><div class="h">#5F7A12</div><div class="u">Lime read as body text · links</div></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:#FBFEF3;border:1px solid var(--by-lime)"></div><div class="n">Lime tint</div><div class="h">#FBFEF3</div><div class="u">Memory surfaces</div></div>
</div>
</body></html>
