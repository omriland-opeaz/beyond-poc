<!-- @dsCard group="Colors" viewport="700x140" name="Semantic colours" subtitle="They carry meaning, not brand — leave them alone" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div class="grid">
  <div class="sw" style="flex:1"><div class="chip" style="background:#9A5C0F;"></div><div class="n">Waiting</div><div class="h">#9A5C0F</div><div class="u">A proposal that needs a human decision</div></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:#C0473F;"></div><div class="n">Broken</div><div class="h">#C0473F</div><div class="u">A dead feed, a fired alert, a fall</div></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:#029B82;"></div><div class="n">Confirmed</div><div class="h">#029B82</div><div class="u">Live source, high confidence, done automatically</div></div>
</div>
</body></html>
