<!-- @dsCard group="Colors" viewport="700x160" name="Water — the lake only" subtitle="Never a button, a link or a status" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Water</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px 18px; background:var(--by-cream); color:var(--by-ink);
         font-family:var(--by-font-sans); -webkit-font-smoothing:antialiased; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chip { height:56px; border-radius:8px; }
  .n { font-size:11px; font-weight:700; letter-spacing:-0.01em; }
  .h { font-size:10px; color:var(--by-grey); font-variant-numeric:tabular-nums; }
  .u { font-size:9.5px; color:var(--by-grey-light); line-height:1.4; }
  .row { display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px solid var(--by-line); }
  .lab { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--by-grey); }
</style></head><body>
<div style="display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:center">
  <div class="grid">
    <div class="sw" style="flex:1"><div class="chip" style="background:#9FD1F2;"></div><div class="n">Water light</div><div class="h">#9FD1F2</div><div class="u">Top of the lake gradient</div></div>
    <div class="sw" style="flex:1"><div class="chip" style="background:#5B9BD9;"></div><div class="n">Water</div><div class="h">#5B9BD9</div><div class="u">Bottom of the gradient · live flows</div></div>
    <div class="sw" style="flex:1"><div class="chip" style="background:#0B2233;"></div><div class="n">Water ink</div><div class="h">#0B2233</div><div class="u">Text on water</div></div>
  </div>
  <div style="height:96px;border-radius:12px;background:linear-gradient(160deg,#9FD1F2,#5B9BD9);border:2px solid var(--by-lime);display:grid;place-items:center;color:#0B2233">
    <span style="font-size:10px;font-weight:700;letter-spacing:.12em">THE LAKE</span>
  </div>
</div>
</body></html>
