<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Big number</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body { margin:0; padding:0; }
  body { width:1280px; height:720px; overflow:hidden; background:var(--by-ink);
         font-family:var(--by-font-sans); color:var(--by-ink); -webkit-font-smoothing:antialiased; }
  .slide { width:1280px; height:720px; padding:72px 88px; display:flex; flex-direction:column; box-sizing:border-box; }
  .kick { font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--by-grey); }
  .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between; font-size:14px; color:var(--by-grey); }
  .num { font-variant-numeric:tabular-nums; }
</style></head><body>
<div class="slide" style="background:var(--by-ink);color:var(--by-cream);justify-content:center">
  <div class="kick" style="color:var(--by-lime)">Done automatically this month</div>
  <div style="font-size:260px;font-weight:800;letter-spacing:-0.05em;line-height:.9;font-variant-numeric:tabular-nums;color:var(--by-lime);margin-top:12px">92</div>
  <p style="font-size:28px;line-height:1.45;max-width:820px;margin:26px 0 0;color:rgba(247,247,239,.8)">actions taken without asking, every one above 90% confidence, every one logged with its rule and reversible.</p>
</div></body></html>
