<!-- @dsCard group="Slides" viewport="1280x720" name="Section" subtitle="Full-bleed numbered opener — lime, water or ink" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Section</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body { margin:0; padding:0; }
  body { width:1280px; height:720px; overflow:hidden; background:var(--by-lime);
         font-family:var(--by-font-sans); color:var(--by-ink); -webkit-font-smoothing:antialiased; }
  .slide { width:1280px; height:720px; padding:72px 88px; display:flex; flex-direction:column; box-sizing:border-box; }
  .kick { font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--by-grey); }
  .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between; font-size:14px; color:var(--by-grey); }
  .num { font-variant-numeric:tabular-nums; }
</style></head><body>
<div class="slide" style="background:var(--by-lime);justify-content:space-between">
  <div style="display:flex;align-items:flex-start;justify-content:space-between">
    <span style="font-size:240px;font-weight:800;letter-spacing:-0.05em;line-height:.85;font-variant-numeric:tabular-nums">01</span>
    <span style="font-size:16px;font-weight:700;letter-spacing:.12em;padding:9px 20px;border-radius:100px;border:1px solid rgba(20,23,15,.28)">CONNECT</span>
  </div>
  <div style="max-width:800px">
    <div style="font-size:52px;font-weight:800;letter-spacing:-0.025em;line-height:1.15">Plug in anything.<br>Really, anything.</div>
    <p style="font-size:21px;line-height:1.55;color:rgba(20,23,15,.72);margin:20px 0 0">Partner portals, wholesaler feeds, an SFTP folder, your mailbox, a spreadsheet nobody has cleaned, a photo of a delivery note.</p>
  </div>
</div></body></html>
