<!-- @dsCard group="Components" viewport="700x340" name="Core" subtitle="Buttons, pills, tabs, cards, ask box, chips" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body { margin:0; padding:18px 20px; background:var(--by-cream); font-family:var(--by-font-sans); color:var(--by-ink); }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = Object.values(window).find(v => v && typeof v === "object" && v.Button && v.AskInput) || window;
  const { Button, Pill, Kicker, Tabs, Card, SectionHeader, StatusDot, AskInput, Chip, SourceIcon } = NS;
  function Demo() {
    const [tab, setTab] = React.useState("digest");
    const [q, setQ] = React.useState("");
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <Button size="lg">Ask your first question →</Button>
          <Button variant="secondary">Keep the national view</Button>
          <Button variant="ink">Open drop zone →</Button>
          <Button shape="square" size="md">Approve</Button>
          <Button variant="danger" size="sm">Reconnect</Button>
          <Button variant="secondary" size="sm" disabled>Export</Button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <Pill tone="lime">Asked for you</Pill>
          <Pill tone="waiting">Waiting on you</Pill>
          <Pill tone="broken">Feed broken</Pill>
          <Pill tone="confirmed">Confidence 96%</Pill>
          <span style={{ background: "var(--by-ink)", padding: 6, borderRadius: 6 }}><Pill tone="cream">Cockpit</Pill></span>
          <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: "var(--by-grey)" }}><StatusDot tone="live" pulse /> live</span>
          <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: "var(--by-grey)" }}><StatusDot tone="idle" /> idle</span>
        </div>
        <Tabs value={tab} onChange={setTab} items={[{ value: "connect", label: "Connect", count: 6 }, { value: "digest", label: "Digest", count: 2 }, { value: "memory", label: "Memory", count: 11 }]} />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, alignItems: "start" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <AskInput size="sm" value={q} onChange={setQ} placeholder="Ask a follow-up" />
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <Chip>Which cities drove it?</Chip><Chip>By pack format</Chip>
            </div>
          </div>
          <Card>
            <SectionHeader title="Waiting on you" note="2 proposals" weight="light" />
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 12 }}>
              <SourceIcon label="TP" tint="#EDEDE2" />
              <div style={{ minWidth: 0 }}>
                <Kicker>Currency · confidence 79%</Kicker>
                <div style={{ fontSize: 12.5, fontWeight: 700, marginTop: 3 }}>Tedis Pharma · sell-in</div>
              </div>
            </div>
          </Card>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
